[[textGuide]]
title = "影画要点"
lines = [
  "L1 犯罪顾问：[普通攻击：萨霍夫跳]的可使用次数上限增加一次，在[狂热]状态下，简的物理异常积蓄效率额外提升15%，同时每点异常精通将会使自身造成的伤害提升0.1%，最多提升30%。",
  "L2 近朱者赤：简攻击命中处于[啮咬]状态下的敌人，或队伍中任意角色对处于[啮咬]状态下的敌人触发[强击]时，将会无视其15%防御力，当[强击]伤害触发暴击时，其暴击伤害额外提升50%。",
  "L3 无名氏：[普通攻击]、[闪避]、[支援技]、[特殊技]、[连携技]技能等级+2",
  "L4 因势利导：队伍中任意角色触发[强击]或[紊乱]效果时，全队角色造成的属性异常伤害提升18%，持续15秒。",
  "L5 囤积癖好：[普通攻击]、[闪避]、[支援技]、[特殊技]、[连携技]技能等级+2",
  "L6 「肮脏」技巧：[狂热]状态下，简的暴击率提升20%，暴击伤害提升40%；队伍中任意角色对敌人施加[强击]效果时，简将直接进入[狂热]状态，并使[狂热心流]回复至上限，本次[强击]伤害触发暴击时，将会对目标发动一次额外攻击，造成等同于简1600%异常精通的物理伤害。",
]
