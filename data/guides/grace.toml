[[textGuide]]
title = "出招表（循环）"
lines = [
  "资源：普通攻击或冲刺攻击造成物理伤害时叠 1 层[电能]（上限 8 层）；满层后发动[特殊技]/[强化特殊技]会消耗全部电能，使该招式聚积的电属性异常积蓄值提升 130%。",
  "基础循环：普攻四段与垫步射击穿插叠电能 → 满 8 层接[强化特殊技：超规工程清障]（两颗手雷）→ 继续普攻回能，等待下一轮强化特殊技。",
  "起手与爆发：连携技[协作施工]、终结技[工程爆破请勿接近]都能一次性打出高额电伤；失衡前预留能量，把强化特殊技与终结技一起打进失衡窗口。",
  "手感：普攻期间发动特殊技、闪避、冲刺攻击不会打断连击段数，可以随时垫步调整身位再继续输出。",
]

[[textGuide]]
title = "注意事项"
lines = [
  "电能只由普通攻击/冲刺攻击的物理伤害获得，单纯扔手雷不叠层；想打出满额积蓄必须保持普攻穿插。",
  "强化特殊技命中后触发额外能力：目标下次[感电]伤害提升 18%，最多叠 2 层；尽量在感电触发前用强化特殊技铺层。",
  "格莉丝是范围型异常，清杂与多目标场景收益最高；单体高抗目标优先保证穿透与异常精通，而不是暴击。",
  "属性为电，页面按电元素图标展示；感电伤害与精通、穿透挂钩，毕业面板以异常精通/攻击力为主。",
]

[[textGuide]]
title = "影画要点"
lines = [
  "L1 再充能弹膛：[普通攻击]第四段每次命中敌人时，全队角色回复0.25点能量； 同一招式内，该效果最多为全队回复2点能量。",
  "L2 电致击穿：在[普通攻击]、[特殊技]、[强化特殊技]等招式中投掷手雷命中敌人时，目标的电属性伤害抗性降低8.5%，电属性异常积蓄抗性降低8.5%，持续8秒。",
  "L3 首席机械师：[普通攻击]、[闪避]、[支援技]、[特殊技]、[连携技]技能等级+2",
  "L4 爆破电容：发动[强化特殊技]时，格莉丝获得6层充能（上限6层）； [普通攻击：高压射钉]或[冲刺攻击：突击检查]命中敌人时，消耗1层充能，使当前招式的能量获得效率提升20%。",
  "L5 「冰冷铁魔女」：[普通攻击]、[闪避]、[支援技]、[特殊技]、[连携技]技能等级+2",
  "L6 起爆扳机：消耗所有[电能]发动[特殊技]或[强化特殊技]时，能够强化招式效果，额外投掷一颗手雷，并使每颗手雷造成的伤害提升至原本的200%。",
]

