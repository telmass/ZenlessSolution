coreText = "[普通攻击：落羽生花]命中处于属性异常状态的目标时，触发一次[异放]：额外结算一次相对于原属性异常伤害的属性异常伤害。\n异放比例（每 10 点异常精通）：\n以太 6.15%\n电 3.20%\n火 8%\n物理 0.75%\n冰 1.08%\n风 0.32%\n[普通攻击：裙裾浮游·悬落]或[普通攻击：落羽生花]命中处于任意属性异常状态的目标时，使目标陷入[薇薇安的预言]，每 0.55 秒受到薇薇安 55% 攻击力的以太伤害，该伤害可以触发属性异常效果的额外伤害；当目标不再处于属性异常状态时，[薇薇安的预言]结束。\n进入战场时，薇薇安获得 2 点[飞羽]。"
