[[textGuide]]
title = "影画要点"
lines = [
  "L1 《在春天走进果园》：累计消耗 4 点[护羽]回复 1 点[飞羽]；[薇薇安的预言]下的目标受到的所有属性异常伤害与[紊乱]伤害 +16%。",
  "L2 《暴风雨夜，暴风雨夜》：以太异常积蓄效率 +25%；[异放]的精通收益提升至 130%，并无视目标 15% 全属性抗性。",
  "L4 《苇间风》：[裙裾浮游·悬落]与[落羽生花]必定暴击、攻击力 +12%；进入战场立即获得 5 点[护羽]。",
  "L6 《薇薇安》：以太伤害 +40%；[悬落]消耗护羽触发特殊[异放]，最多 5 点护羽使伤害比例提升至 5 倍。",
]
