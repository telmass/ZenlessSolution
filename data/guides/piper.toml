[[textGuide]]
title = "出招表（循环）"
lines = [
  "资源：[动力]由[强化特殊技：引擎转]或[终结技]的旋转斩击命中获得，每层 +4% 物理异常积蓄效率，上限 20 层、持续 12 秒。",
  "基础循环：普攻前三段（或冲刺攻击、闪避反击）后接[特殊技：轮胎转]，长按升蓄力，松手打[特殊技：有亿点重]。",
  "满蓄力后继续长按进入[强化特殊技：引擎转]，最多持续 3 秒；松手或能量降到 20 点自动接[强化特殊技：非常重]。",
  "爆发：终结技[坐～稳～啦～]一次叠多层动力；进失衡前把动力叠到 20 层，让额外能力的全队 +18% 增伤覆盖失衡窗口。",
]

[[textGuide]]
title = "注意事项"
lines = [
  "[动力]只由强化特殊技/终结技的旋转斩击叠层，[特殊技：轮胎转]本身不叠；想快速满层要靠引擎转或终结技。",
  "引擎转持续消耗能量、最多 3 秒，能量低于 20 会自动下砸；留足能量给下一轮，别把能量打空。",
  "额外能力需要队内有同属性/同阵营或异常角色，且动力 ≥ 20 层才给全队 18% 增伤，配队时优先满足条件。",
  "[轮胎转]期间受伤降低 40%，可以主动用来抗打断；但派派仍以异常积蓄为主，不必强求暴击词条。",
]

[[textGuide]]
title = "影画要点"
lines = [
  "L1 悠闲一刻：派派在[特殊技：轮胎转]、[强化特殊技：引擎转]或[终结技]中发动旋转斩击命中敌人时，有50%概率额外获得1层[动力]，[动力]的叠加层数上限提升至30层。",
  "L2 上进心：在[特殊技：轮胎转]和[强化特殊技：引擎转]发动期间，派派的移动速度有所提升；在[特殊技：有亿点重]、[强化特殊技：非常重]和[终结技]中发动下砸攻击命中敌人时，招式造成的物理伤害提升10%，每拥有1层[动力]，该增益效果额外提升1%。",
  "L3 卡车专家：[普通攻击]、[闪避]、[支援技]、[特殊技]、[连携技]技能等级+2",
  "L4 技巧娴熟：队伍中任意角色对敌人施加属性异常效果时，派派回复20点能量，30秒内最多触发一次。",
  "L5 私人爱好：[普通攻击]、[闪避]、[支援技]、[特殊技]、[连携技]技能等级+2",
  "L6 轻度兴奋：[强化特殊技：引擎转]的持续时间上限提升2秒，[动力]的持续时间提升4秒。",
]

